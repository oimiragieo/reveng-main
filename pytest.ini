[pytest]
# pytest configuration for REVENG

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Logging
log_cli = false
log_cli_level = INFO
log_file = test_results.log
log_file_level = DEBUG

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

filterwarnings =
    ignore:'asyncio\.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead:DeprecationWarning:opentelemetry\.util\._decorator

# Coverage (optional)
# --cov=src/reveng
# --cov-report=html
# --cov-report=term-missing

# Markers (defined in conftest.py)
markers =
    poc: Proof-of-concept tests for optional environment-heavy validation
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium speed, external tools optional)
    e2e: End-to-end tests (slow, requires full environment)
    performance: Performance benchmarking tests (slow)
    malware: Malware analysis tests
    ghidra: Ghidra integration tests (requires Ghidra)
    pipeline: Pipeline tests
    ml: Machine learning tests
    slow: Slow running tests (>5s)
    fast: Fast running tests (<1s)
    requires_external_tools: Requires external tools (Ghidra, ILSpy, etc)
    requires_network: Requires network connectivity

# Helpful pytest command examples:
# Optional POC suite:       pytest tests/poc/ -m "poc and requires_external_tools"
# Fast tests only:        pytest -m "fast"
# Unit tests only:        pytest -m "unit"
# Exclude slow tests:     pytest -m "not slow"
# Exclude external tools: pytest -m "not requires_external_tools"
# Integration + E2E:      pytest -m "integration or e2e"
# Full test suite:        pytest
