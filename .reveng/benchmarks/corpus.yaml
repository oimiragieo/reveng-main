# .reveng/benchmarks/corpus.yaml
# Tracked corpus for the Verified Recompilation Loop (VRL) benchmark.
# Every entry declares a target binary and the current best validation grade
# achieved. Regression-gated: the VRL CI suite (Phase 1.5) will fail if any
# entry drops below its recorded grade.
#
# Validation grades (ascending priority):
#   unknown (-1)
#   analysis_only (0)
#   compile_only (1)
#   structural_candidate (2)
#   launches_but_divergent (3)
#   partial_equivalence (4)
#   behavior_matched (5)
#   source_reconstruction_match (6)
#   evidence_backed (7)

schema_version: 1
updated: "2026-04-10"
owner: "reveng-core"

binaries:
