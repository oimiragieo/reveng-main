name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Wave 2 W2-3 (CI-UNICORN-BUILD-1): macOS legs install slim requirements
  # (no angr/unicorn/claripy) — unicorn source builds fail on modern CMake
  # (cmake_minimum_required <3.5; see unicorn#2263). Ubuntu/Windows keep full
  # deps. Not a claim that angr is green. fail-fast:false retained.
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.11, 3.12]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (Linux/Windows)
        if: matrix.os != 'macos-latest'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Install dependencies (macOS slim)
        if: matrix.os == 'macos-latest'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci-macos-slim.txt
          pip install -r requirements-ci-macos-slim-dev.txt
          pip install -e . --no-deps

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang
          # Ghidra is not in default Ubuntu apt; optional tools gated by markers.

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-java.txt
          pip install -e . --no-deps

      - name: Run integration tests
        run: pytest tests/integration/ -v --cov=src --cov-report=xml

      - name: Upload integration coverage
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          flags: integration
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e-tests:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      # web_interface was removed; E2E suite is CLI/API only.
      - name: Run E2E tests
        run: pytest tests/e2e/ -v --timeout=300

  performance-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Run performance tests
        run: pytest tests/performance/ -v --timeout=600

      - name: Upload performance results
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: performance_results/
