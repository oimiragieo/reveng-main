name: Code Quality

on: [push, pull_request]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Run black
        run: black --check src/ tests/

      - name: Run isort
        run: isort --check-only src/ tests/

      - name: Run import-linter (architecture contracts)
        run: lint-imports --no-cache

      # Full-tree pylint/mypy remain noisy on legacy modules; keep as signal, not merge blockers.
      - name: Run pylint
        continue-on-error: true
        run: pylint src/

      - name: Run mypy
        continue-on-error: true
        run: mypy src/

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run yamllint
        uses: karancode/yamllint-github-action@v3.0.0
        with:
          yamllint_file_or_dir: '.github'
          yamllint_config_filepath: '.yamllint'
          yamllint_strict: 'false'

  lint-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: 'Dockerfile'
          ignore: DL3008,DL3009,DL3015
