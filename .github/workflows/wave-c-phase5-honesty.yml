# Wave C / Phase 5 thin equivalence honesty gate (M4 closer — not full nightly).
# Fail-closed: missing/empty reports/equivalence_honesty/latest.json fails the job.
# Does NOT flip native required:true; does NOT claim M2 done; corpus residual remains open.

name: Wave C Phase 5 Honesty

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  equivalence-honesty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Fail-closed verify tracked equivalence report
        run: |
          test -s reports/equivalence_honesty/latest.json
          /usr/bin/python3.9 scripts/verify_equivalence_honesty.py \
            --evidence reports/equivalence_honesty/latest.json

      - name: Customer-path emit + re-verify (Makefile-equivalent)
        run: |
          /usr/bin/python3.9 scripts/verify_equivalence_honesty.py --emit-report
          /usr/bin/python3.9 scripts/verify_equivalence_honesty.py

      - name: Phase 5 honesty unit tests (no cov)
        run: |
          pytest --no-cov \
            tests/unit/test_equivalence_honesty_gate.py \
            tests/unit/test_phase5_honesty_workflow.py
