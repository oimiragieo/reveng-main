name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]
        python -m pip install -r requirements-optional.txt || true

    - name: Lint with pylint
      run: |
        pylint src/reveng/ --disable=C0114,C0116

    - name: Type check with mypy
      run: |
        mypy src/reveng/ --ignore-missing-imports

    - name: Security scan with bandit
      run: |
        bandit -r src/reveng/ -f json -o bandit-report.json || true

    - name: Dependency vulnerability check with Safety
      run: |
        safety check --file requirements.txt --json > safety-report.json || true
        safety check --file requirements-dev.txt --continue-on-error || true

    - name: Format check with black
      run: |
        black --check src/reveng/

    - name: Import sorting check with isort
      run: |
        isort --check-only src/reveng/

    - name: Test with pytest
      run: |
        python -m pytest tests/unit tests/integration --cov=reveng --cov-report=xml --cov-report=html

    - name: Enforce coverage threshold (10%)
      run: |
        python -m pytest tests/unit --cov=reveng --cov-report=term --cov-fail-under=10
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      run: |
        docker build -t reveng:latest .

    - name: Test Docker image
      run: |
        docker run --rm reveng:latest --help

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
