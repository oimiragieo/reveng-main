site_name: REVENG Documentation
site_url: https://docs.reveng-toolkit.org
repo_url: https://github.com/oimiragieo/reveng-main
repo_name: oimiragieo/reveng-main
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

nav:
  - Home: README.md
  - Support:
    - Maturity badges: support/maturity-badges.md
    - Support matrix: support/support-matrix.md
    - Honesty rules: support/honesty-rules.md
    - Reading validation grades: support/reading-validation-grades.md
    - GA-ish path checklist: support/ga-path-checklist.md
  - Tutorials:
    - Analyst:
      - Install and triage: tutorials/analyst/01-install-and-triage.md
      - App reverse-engineer: tutorials/analyst/02-app-reverse-engineer.md
      - Reading outputs: tutorials/analyst/03-reading-outputs.md
    - Engineer:
      - Dev setup: tutorials/engineer/01-dev-setup.md
      - Unit and honesty gates: tutorials/engineer/02-run-unit-and-honesty-gates.md
  - How-to:
    - Analyst:
      - Triage PE: how-to/analyst/triage-pe.md
      - YARA and VT: how-to/analyst/yara-and-vt.md
      - Bun executable: how-to/analyst/bun-executable.md
      - When Ghidra is required: how-to/analyst/when-ghidra-is-required.md
      - App RE JavaScript: how-to/analyst/app-re-javascript.md
      - App RE JVM: how-to/analyst/app-re-jvm.md
      - App RE Python: how-to/analyst/app-re-python.md
      - App RE .NET: how-to/analyst/app-re-dotnet.md
    - Engineer:
      - Add adapter: how-to/engineer/add-adapter.md
      - Extend CLI: how-to/engineer/extend-cli.md
      - Wire MCP tool: how-to/engineer/wire-mcp-tool.md
      - Update support matrix: how-to/engineer/update-support-matrix.md
      - Scoped git and commits: how-to/engineer/scoped-git-and-commits.md
  - Explanation:
    - Architecture overview: explanation/architecture-overview.md
    - Analysis pipeline: explanation/analysis-pipeline.md
    - App RE dispatch: explanation/app-re-dispatch.md
    - VRL and verification: explanation/vrl-and-verification.md
    - Result contracts: explanation/result-contracts.md
    - Ghidra boundary: explanation/ghidra-boundary.md
    - AI providers: explanation/ai-providers.md
    - pipeline vs pipelines: explanation/pipeline-vs-pipelines.md
    - Security and exploits: explanation/security-and-exploits.md
  - Reference:
    - CLI: reference/cli.md
    - Python API: reference/python-api.md
    - MCP tools: reference/mcp-tools.md
    - Config and env: reference/config-and-env.md
    - Corpus and GA scripts: reference/corpus-and-ga-scripts.md
  - Legacy guides:
    - Getting started install: getting-started/installation.md
    - CLI usage: user-guide/cli-usage.md
    - Bun reversing: user-guide/bun-reversing.md
    - MCP setup notes: mcp/README.md
    - Developer guide: developer-guide/DEVELOPER_GUIDE.md
    - API reference: api/API_REFERENCE.md
  - Ops:
    - Ops index: ops/README.md
  - Deployment:
    - Deployment notes: deployment/README.md
    - Release evidence: deployment/release-evidence-verification.md
    - Privacy: legal/PRIVACY.md

plugins:
  - search:
      lang: en
  - mermaid2:
      arguments:
        theme: base
        themeVariables:
          primaryColor: '#6366f1'
          primaryTextColor: '#ffffff'
          primaryBorderColor: '#4f46e5'
          lineColor: '#6b7280'
          secondaryColor: '#f3f4f6'
          tertiaryColor: '#ffffff'

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite:
      css_class: highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oimiragieo/reveng-main
  version:
    provider: mike
