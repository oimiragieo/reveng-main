site_name: REVENG Documentation
site_url: https://docs.reveng-toolkit.org
repo_url: https://github.com/oimiragieo/reveng-main
repo_name: oimiragieo/reveng-main
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

nav:
  - Home: README.md
  - Getting Started:
    - Installation: getting-started/installation.md
  - User Guide:
    - CLI Usage: user-guide/cli-usage.md
    - Bun Executable Reversing: user-guide/bun-reversing.md
    - MCP Guide: mcp/README.md
  - Developer Guide:
    - Developer Guide: developer-guide/DEVELOPER_GUIDE.md
    - API Reference: api/API_REFERENCE.md
  - Architecture:
    - Overview: architecture/overview.md
    - REVENG System Paper: architecture/reveng-system-paper.md
    - Feature Research Roadmap: architecture/reveng-feature-roadmap.md
    - World-Class Implementation Roadmap: architecture/reveng-world-class-implementation-roadmap.md
    - World-Class Execution Backlog: architecture/reveng-world-class-execution-backlog.md
    - TDD Microservices Plan: architecture/reveng-tdd-microservices-plan.md
    - TDD Implementation Backlog: architecture/reveng-tdd-implementation-backlog.md
    - Bun Escalation Paths: architecture/bun-escalation-paths.md
    - Bun Real-Sample Matrix: architecture/bun-real-sample-matrix.md
  - Deployment:
    - Deployment Notes: deployment/README.md
    - Privacy Notes: legal/PRIVACY.md
  - Release History:
    - v4.0: changelogs/v4.0.md
    - v5.0: changelogs/v5.0.md
    - v6.0: changelogs/v6.0.md

plugins:
  - search:
      lang: en
  - mermaid2:
      arguments:
        theme: base
        themeVariables:
          primaryColor: '#6366f1'
          primaryTextColor: '#ffffff'
          primaryBorderColor: '#4f46e5'
          lineColor: '#6b7280'
          secondaryColor: '#f3f4f6'
          tertiaryColor: '#ffffff'

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite:
      css_class: highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oimiragieo/reveng-main
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/reveng_toolkit
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/reveng/cli
  version:
    provider: mike
